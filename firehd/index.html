<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Usage</title>
<style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans",sans-serif;background:#101616;color:#edf7f3}*{box-sizing:border-box}body{margin:0;padding:5vw;min-height:100vh}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:5vh}h1{font-size:clamp(28px,5vw,58px);margin:5px 0}small,.muted{color:#a1b7ae}.eyebrow{letter-spacing:.3em;font-size:13px;color:#81dfbd}.grid{display:grid;grid-template-columns:1fr 1fr;gap:3vw}article{background:#192323;border:1px solid #30423c;border-radius:24px;padding:3vw}h2{font-size:clamp(24px,4vw,44px);margin:0 0 20px}.row{margin:22px 0}.label{display:flex;justify-content:space-between;align-items:baseline;font-size:18px}.value{font-size:clamp(30px,5vw,62px);font-variant-numeric:tabular-nums}progress{width:100%;height:14px;accent-color:#83dfba}footer{margin-top:4vh;color:#a1b7ae;font-size:15px}button{background:#263d34;color:#e7fff4;border:1px solid #548d75;border-radius:10px;padding:13px 18px;font-size:16px}.warning{color:#ffcf89}#clock{font-size:20px}@media(max-width:600px){.grid{grid-template-columns:1fr}body{padding:24px}article{padding:24px}}
</style>
<header><div><div class="eyebrow">AI USAGE</div><h1>Codex と Claude</h1><div class="muted">5時間・週間の残量</div></div><div><div id="clock"></div><button id="refresh">今すぐ確認</button></div></header>
<main class="grid" id="providers"></main><footer id="status" role="status">データを確認しています。</footer>
<script>
(function(){
'use strict';
var last=null,failed=false,cache='ai-usage-last-snapshot';
function valid(s){return s&&s.schemaVersion===1&&Number.isFinite(Date.parse(s.generatedAt))&&Date.parse(s.generatedAt)<=Date.now()+300000&&Array.isArray(s.providers)&&s.providers.length<=2&&s.providers.every(function(p){return ['codex','claude'].indexOf(p.id)>=0&&Array.isArray(p.windows)&&p.windows.every(function(w){return Number.isFinite(w.remainingPercent)&&w.remainingPercent>=0&&w.remainingPercent<=100})})}
try{var saved=JSON.parse(localStorage.getItem(cache));if(valid(saved))last=saved}catch(e){}
function text(parent,tag,value,cls){var el=document.createElement(tag);el.textContent=value;if(cls)el.className=cls;parent.appendChild(el);return el}
function time(v){return v?new Date(v).toLocaleString('ja-JP'):'未取得'}
function countdown(ms){
 var minutes=Math.floor(ms/60000),hours=Math.floor(minutes/60);
 var value=hours>=24?Math.floor(hours/24)+'日'+hours%24+'時間':hours>0?hours+'時間'+minutes%60+'分':minutes>0?minutes+'分':'1分未満';
 return '（あと'+value+'）';
}
function render(){
 document.getElementById('clock').textContent=new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'});
 var root=document.getElementById('providers');root.textContent='';
 ['codex','claude'].forEach(function(id){var p=last&&last.providers.find(function(v){return v.id===id})||{windows:[]};var card=text(root,'article','');text(card,'h2',id==='codex'?'Codex':'Claude');
 var stale=failed||p.status==='stale'||!p.measuredAt||Date.now()-Date.parse(p.measuredAt)>1800000;
 ['session','weekly'].forEach(function(key){var w=p.windows.find(function(v){return v.id===key});var reset=w?Date.parse(w.resetsAt):NaN;var remaining=reset-Date.now();var expired=Number.isFinite(reset)&&remaining<=0;var row=text(card,'div','','row');var heading=text(row,'div','','label');text(heading,'span',key==='session'?'5時間':'週間');text(heading,'span',!w||expired?'—':Math.round(w.remainingPercent)+'%','value');if(w&&!expired){var bar=document.createElement('progress');bar.max=100;bar.value=w.remainingPercent;row.appendChild(bar)}text(row,'small',!w||expired?'更新待ち':Number.isFinite(reset)?'リセット '+time(w.resetsAt)+countdown(remaining):w.resetLabel||'リセット時刻は未取得')});
 if(id==='codex')text(card,'div','クレジット '+(p.credits==null?'—':p.credits));text(card,'p',stale?'更新待ち（前回値を表示）':'取得済み',stale?'warning':'muted');text(card,'small','取得 '+time(p.measuredAt));
 });
 document.getElementById('status').textContent=failed?'M1に接続できません。前回の取得時刻と値を表示しています。':'M1の取得データを1分ごとに確認します。残量の取得は15分ごとです。';
}
async function refresh(){try{var r=await fetch('/usage.json',{cache:'no-store'});if(!r.ok)throw Error();var s=await r.json();if(!valid(s))throw Error();if(!last||Date.parse(s.generatedAt)>=Date.parse(last.generatedAt)){last=s;try{localStorage.setItem(cache,JSON.stringify(s))}catch(e){}}failed=false}catch(e){failed=true}render()}
document.getElementById('refresh').onclick=refresh;render();refresh();setInterval(refresh,60000);setInterval(render,1000);
})();
</script></html>
